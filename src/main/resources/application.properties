# 默认配置（打进 war，绝不含真实口令）。
# 覆盖规则见 config/PropertyConfig：本文件打底，外部 db.properties 覆盖——
# 真实口令只写在本机 db.properties（gitignore），评分红线：口令不进 git、不进 war。

# ---------------- 数据源（连接串后缀与 Boot 时代 application.yml 完全一致） ----------------
db.url=jdbc:mysql://localhost:3306/spore_cms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
db.username=root
db.password=CHANGE_ME

# ---------------- 业务配置（对应原 application.yml 的 spore.* 段） ----------------
# 「题库目录」：题图存这；设置页可改（handoff §2 迁移协议）
spore.storage.data-dir=./data/attachments
# GUI 拉手机的节奏（手动刷新按钮随时触发）
spore.sync.pull-interval-seconds=30
# 登录 token 有效期（小时）；签名密钥运行时随机生成，不写死
spore.jwt.expire-hours=720
