name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 单进程 PySide6 应用：CI 必须在 Windows（instance_lock 模块顶层绑定 kernel32）。
  # conftest 自带 offscreen QPA，不需要桌面会话。
  client-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install pinned deps
        run: >-
          python -m pip install
          -r client/requirements.txt
          pytest ruff

      # pyproject 已配 ruff 规则集（E/F/I/UP/B/SIM）——进 CI 当门禁
      - name: Lint (ruff)
        working-directory: client
        run: python -m ruff check .

      - name: Run tests
        working-directory: client
        run: python -m pytest tests
